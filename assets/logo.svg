<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fast Reviewer app icon: a split diff (removed | added) struck by a lightning bolt.
       macOS icon grid: 824px rounded-square body centered on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#body)">
    <!-- old side -->
    <rect x="178" y="236" width="290" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <rect x="178" y="318" width="290" height="46" rx="16" fill="#f85149"/>
    <rect x="178" y="400" width="214" height="46" rx="16" fill="#f85149" opacity=".6"/>
    <rect x="178" y="482" width="252" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <rect x="178" y="564" width="190" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <rect x="178" y="646" width="236" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <!-- pane divider -->
    <rect x="509" y="200" width="6" height="624" rx="3" fill="#fff" opacity=".12"/>
    <!-- new side -->
    <rect x="556" y="236" width="290" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <rect x="556" y="318" width="290" height="46" rx="16" fill="#3fb950"/>
    <rect x="556" y="400" width="252" height="46" rx="16" fill="#3fb950" opacity=".6"/>
    <rect x="556" y="482" width="290" height="46" rx="16" fill="#3fb950"/>
    <rect x="556" y="564" width="206" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <rect x="556" y="646" width="244" height="46" rx="16" fill="#94a3b8" opacity=".38"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <!-- bolt -->
  <path d="M 566 168 L 336 566 L 488 566 L 440 856 L 700 436 L 544 436 Z"
        fill="url(#bolt)" stroke="#0f172a" stroke-width="22" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2"/>
</svg>
