name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run midway: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint & test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Rust fmt
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build-macos:
    name: Build macOS app (universal)
    runs-on: macos-14
    # Apple's notary service usually answers in minutes, but a first submission took 68.
    timeout-minutes: 90
    outputs:
      notarized: ${{ steps.build.outputs.notarized }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build, sign and notarize .app and .dmg
        id: build
        run: scripts/ci/macos-build.sh
        env:
          OUT_DIR: out
          # Unset secrets (forks, first setup) fall back to an ad-hoc signed build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: fast-reviewer-macos
          path: out/*
          retention-days: 30

  release:
    name: Publish release
    # Version tags (v*) and every push to main. Only notarized builds are published:
    # an unnotarized DMG can't be opened after download.
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      needs.build-macos.outputs.notarized == 'true'
    needs: [test, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fast-reviewer-macos
          path: out
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Tags created with GITHUB_TOKEN don't trigger another CI run.
            tag="v${VERSION}"
          fi

          # The in-app updater reads latest.json from the latest release
          # (plugins > updater > endpoints in tauri.conf.json).
          tar=Fast-Reviewer-macOS-universal.app.tar.gz
          if [ -f "out/$tar.sig" ]; then
            jq -n \
              --arg version "$VERSION" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$tar" \
              --arg sig "$(cat "out/$tar.sig")" \
              '{version: $version, pub_date: $date, platforms: {
                 "darwin-aarch64": {url: $url, signature: $sig},
                 "darwin-x86_64": {url: $url, signature: $sig}}}' > out/latest.json
            cat out/latest.json
          else
            echo "::warning::No signed updater archive: installed apps won't be offered this release."
          fi

          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fast Reviewer $tag" \
            --generate-notes \
            --latest
