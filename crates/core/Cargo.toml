[package]
name = "fast_reviewer_core"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
lru = "0.18.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "json", "charset"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11.0"
similar = { version = "2", features = ["unicode", "inline"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6.5"
